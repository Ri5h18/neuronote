<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroNote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
                950: '#172554',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* Markdown Preview Styles */
      .markdown-preview { line-height: 1.6; }
      .markdown-preview h1 { font-size: 1.75em; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; color: #1f2937; }
      .dark .markdown-preview h1 { color: #f3f4f6; border-bottom-color: #374151; }
      
      .markdown-preview h2 { font-size: 1.5em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: #374151; }
      .dark .markdown-preview h2 { color: #e5e7eb; }

      .markdown-preview h3 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }

      .markdown-preview p { margin-bottom: 1em; }
      .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      
      .markdown-preview a { color: #3b82f6; text-decoration: underline; }
      .dark .markdown-preview a { color: #60a5fa; }
      
      /* Greentext / Blockquote Style */
      .markdown-preview blockquote { 
        border-left: 4px solid #22c55e; 
        padding-left: 1rem; 
        color: #16a34a; 
        background: rgba(34, 197, 94, 0.05);
        padding: 0.5rem 0.5rem 0.5rem 1rem; 
        border-radius: 0 4px 4px 0;
        margin: 1em 0;
        font-family: 'Inter', sans-serif;
      }
      .dark .markdown-preview blockquote { 
        color: #4ade80; 
        border-left-color: #22c55e; 
        background: rgba(34, 197, 94, 0.1);
      }

      .markdown-preview code { font-family: monospace; background: rgba(0,0,0,0.05); padding: 0.2em 0.4em; border-radius: 0.25em; font-size: 0.9em; }
      .dark .markdown-preview code { background: rgba(255,255,255,0.1); }
      
      .markdown-preview pre { background: #1e293b; color: #f8fafc; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
      .markdown-preview pre code { background: transparent; padding: 0; color: inherit; }
      
      .markdown-preview img { max-width: 100%; border-radius: 0.5rem; margin: 1em 0; }
      .markdown-preview strong { font-weight: 700; }
      .markdown-preview em { font-style: italic; }
      .markdown-preview del { text-decoration: line-through; opacity: 0.7; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0",
    "marked": "https://aistudiocdn.com/marked@^12.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
